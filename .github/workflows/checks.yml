name: checks

# 为什么要有 CI：本仓库最强的几道闸（变异测试、前缀稳定性、const 赋值、
# 桥接契约、注册表一致性）此前全部是**可选且手动**的 —— 没有 .github/，
# `npm test` 也不包含它们中的三道。门禁不被强制运行就等于不存在：
# 实测 mutation-check 已因 CRLF 与重构失配而静默失效，却无人发现。
on:
  push:
  pull_request:
  workflow_dispatch:
  # 夜间 02:00 UTC：完整 E2E 只在定时与手动触发时跑（e2e-nightly job 里有 if 守卫）。
  schedule:
    - cron: '0 2 * * *'

jobs:
  checks:
    # 钉版本而不是 ubuntu-latest：GitHub 会在自己决定的那天把 ubuntu-latest
    # 指向新系统镜像（2026-10-19 起开始指向 Ubuntu 26），门禁结果就不再可复现。
    # 要迁移时显式改这个标签，并跑一次夜间 E2E 确认。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # TS 迁移期（TITA-73 / Batch 0）：22 → 24。
          # 依据：Node 的 type stripping（直接跑 import 了 .ts 的模块）在 22.18.0 起
          # 才默认开启；`'22'` 解析到哪个小版本取决于 runner 镜像，属于「靠运气」。
          # 钉 24 与本地实测版本（v24.19.0）一致，也让 CI 与本地行为可复现。
          node-version: '24'
      # 依赖缓存：缓存 npm 的下载缓存（~/.npm），不是 node_modules。
      # node_modules 缓存 + npm ci 收益为零 —— npm ci 会先把整个 node_modules 删掉，
      # 命中缓存也没有意义。缓存必须排在对应的 npm ci 之前。
      - name: 缓存依赖下载缓存
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json', 'package.json', 'integrations/opencode/recallflow-mcp/package-lock.json', 'integrations/opencode/recallflow-mcp/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      # 根目录必须装依赖：扩展**运行时**零依赖，但测试门禁不是。
      # run-all-checks 会跑 tests/content-bundle-freshness.test.mjs（静态 import
      # scripts/build-content.mjs → esbuild）和 tests/e2e-hygiene.test.mjs
      # （动态 import @playwright/test）。只装 MCP 子包会让第一步就
      # ERR_MODULE_NOT_FOUND，整个 job exit 1（2026-10-24 run 40114474817）。
      - name: 安装根依赖
        run: npm ci --prefer-offline --no-audit --no-fund
      # MCP 子包有独立依赖（@modelcontextprotocol/sdk、ws），根依赖覆盖不到它。
      - name: 安装 MCP 子包依赖
        working-directory: integrations/opencode/recallflow-mcp
        run: npm ci --prefer-offline --no-audit --no-fund
      # 一条命令跑「单测 + 三道静态门禁」。用 node 直接调用，
      # 不依赖 npm 的脚本执行策略（Windows 上 npm.ps1 常被执行策略拦住）。
      - name: 单元测试 + 静态门禁
        run: node scripts/run-all-checks.mjs
      # 桥接层端到端验证：起真实 server 进程 + 真实 WS 客户端。
      # 这一段「改一次就要重载扩展 + 重启 server」，此前完全没有回归测试。
      - name: 桥接 WS 鉴权端到端验证
        run: node scripts/verify-bridge-ws-handshake.mjs

  # 完整 E2E（87 条）不适合塞进 PR —— 真浏览器 + 真扩展，跑完要好几分钟。
  # 但只在本地跑就等于没有：本地跑不跑全靠人记得。所以放夜间定时 + 可手动触发，
  # 失败时把 trace/截图留下来，第二天来看得见。
  e2e-nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 同上（checks job 的注释）：TS 迁移期钉 24，与本地一致。
          node-version: '24'
      - name: 安装根依赖
        run: npm ci
      - name: 安装 Chromium 与系统依赖
        run: npx playwright install --with-deps chromium
      - name: 确保有虚拟显示
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: 完整 E2E
        run: xvfb-run -a npm run test:e2e
      - name: 上传失败诊断
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-nightly-failure
          path: |
            tests/e2e/test-results
          if-no-files-found: ignore
