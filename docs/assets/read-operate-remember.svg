<svg width="900" height="320" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rbg" x1="60" y1="60" x2="230" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2369B3"/>
      <stop offset="1" stop-color="#123B73"/>
    </linearGradient>
    <linearGradient id="obg" x1="360" y1="60" x2="540" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2d9d78"/>
      <stop offset="1" stop-color="#1e7a5b"/>
    </linearGradient>
    <linearGradient id="mbg" x1="670" y1="60" x2="840" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9b59b6"/>
      <stop offset="1" stop-color="#6d3a9b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#123B73"/>
    </marker>
  </defs>

  <!-- connector arrows (loop) -->
  <path d="M 248 250 Q 300 285 370 250" stroke="#7ea6d8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 548 250 Q 610 285 680 250" stroke="#7ea6d8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 680 70 Q 450 8 220 70" stroke="#7ea6d8" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/>

  <!-- READ -->
  <rect x="40" y="70" width="210" height="180" rx="18" fill="url(#rbg)"/>
  <circle cx="82" cy="104" r="14" fill="#BDEBFF" opacity=".9"/>
  <text x="82" y="104" text-anchor="middle" dy="0.35em" font-size="14" fill="#0e2a4a" font-weight="bold">R</text>
  <text x="108" y="109" font-size="22" fill="#ffffff" font-weight="bold">Read</text>
  <text x="64" y="150" font-size="14" fill="#cfe6ff">Ask on selection · translate</text>
  <text x="64" y="176" font-size="14" fill="#cfe6ff">Summarize · explain · finish</text>
  <text x="64" y="202" font-size="14" fill="#cfe6ff">RAG knowledge-base search</text>
  <text x="64" y="228" font-size="14" fill="#cfe6ff">Grounded in full-page context</text>

  <!-- OPERATE -->
  <rect x="345" y="70" width="210" height="180" rx="18" fill="url(#obg)"/>
  <circle cx="387" cy="104" r="14" fill="#BDEBFF" opacity=".9"/>
  <text x="387" y="104" text-anchor="middle" dy="0.35em" font-size="14" fill="#0c2f24" font-weight="bold">O</text>
  <text x="413" y="109" font-size="22" fill="#ffffff" font-weight="bold">Operate</text>
  <text x="369" y="150" font-size="14" fill="#d9fff0">Highlight · locate · scroll</text>
  <text x="369" y="176" font-size="14" fill="#d9fff0">Outline · click · restyle</text>
  <text x="369" y="202" font-size="14" fill="#d9fff0">Structured page_command</text>
  <text x="369" y="228" font-size="14" fill="#d9fff0">Agent drives the page directly</text>

  <!-- REMEMBER -->
  <rect x="650" y="70" width="210" height="180" rx="18" fill="url(#mbg)"/>
  <circle cx="692" cy="104" r="14" fill="#BDEBFF" opacity=".9"/>
  <text x="692" y="104" text-anchor="middle" dy="0.35em" font-size="14" fill="#2a1142" font-weight="bold">M</text>
  <text x="718" y="109" font-size="22" fill="#ffffff" font-weight="bold">Remember</text>
  <text x="674" y="150" font-size="14" fill="#f0dfff">One click: saved locally</text>
  <text x="674" y="176" font-size="14" fill="#f0dfff">Mistakes · articles · prompts</text>
  <text x="674" y="202" font-size="14" fill="#f0dfff">Next answers build on it</text>
  <text x="674" y="228" font-size="14" fill="#f0dfff">Data stays 100% local</text>

  <!-- footer caption -->
  <text x="450" y="300" text-anchor="middle" font-size="15" fill="#123B73" font-weight="600">In the browser, let AI “read → operate → remember” any web page</text>
</svg>
