<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>RecallFlow - 管理</title>
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-group"><div class="brand-mark" aria-hidden="true">R</div><div><h1>RecallFlow</h1><span class="page-caption">资料库</span></div></div>
    <div class="header-actions"><button id="add-note-btn" class="btn btn-primary"><span aria-hidden="true">＋</span> 新建笔记</button><details class="more-menu"><summary class="btn btn-secondary" aria-label="更多操作">⋯</summary><div class="more-menu-panel"><button id="import-btn">导入 JSON</button>
    <input id="import-file" type="file" accept=".json" style="display:none">
    <button id="export-btn">导出 JSON</button></div></details></div>
  </header>

  <nav class="module-nav" aria-label="模块导航">
    <a class="module-nav-item active" href="manager.html" aria-current="page">知识库</a>
    <a class="module-nav-item" href="userscripts.html">脚本中心<span id="us-count-badge" class="module-nav-badge hidden">0</span></a>
    <a class="module-nav-item" href="options.html">设置</a>
  </nav>

  <div class="kb-toolbar">
    <label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索标题、备注或标签" aria-label="搜索笔记"><kbd>Ctrl K</kbd></label>
  </div>

  <div class="bulk-bar hidden" id="bulk-bar">
    <span class="bulk-count" id="bulk-count">0 项已选</span>
    <button class="mini" id="bulk-select-all-btn">全选</button>
    <button class="mini danger" id="bulk-delete-btn">删除选中</button>
    <button class="mini" id="bulk-cancel-btn">取消</button>
  </div>

  <nav class="type-tabs" id="type-tabs"></nav>

  <div class="tag-filter" id="tag-filter"></div>
  <section class="active-filters" aria-live="polite"><span class="filter-label">当前筛选</span><div id="active-filter-list"><span class="filter-empty">全部内容</span></div><button id="clear-filters" class="link-button" type="button">清除全部</button></section>

  <section class="stats" id="stats">
    <div class="stat-card" data-s="all">
      <span class="num" id="st-total">0</span>
      <span class="lbl">全部</span>
    </div>
    <div class="stat-card" data-s="1">
      <span class="num" id="st-1">0</span>
      <span class="lbl stars-lbl" data-stars="1"></span>
    </div>
    <div class="stat-card" data-s="2">
      <span class="num" id="st-2">0</span>
      <span class="lbl stars-lbl" data-stars="2"></span>
    </div>
    <div class="stat-card" data-s="3">
      <span class="num" id="st-3">0</span>
      <span class="lbl stars-lbl" data-stars="3"></span>
    </div>
  </section>

  <div class="toolbar">
    <select id="sort-select" class="sort-select" title="排序方式">
      <option value="updated">最近更新</option>
      <option value="created">最近收录</option>
      <option value="star-desc">星级高→低</option>
      <option value="star-asc">星级低→高</option>
    </select>
  </div>

  <main id="list" class="list"></main>
  <div id="empty" class="empty hidden"></div>

  <div class="confirm-overlay hidden" id="confirm-overlay">
    <div class="confirm-dialog">
      <div class="confirm-msg" id="confirm-msg"></div>
      <div class="confirm-actions">
        <button class="mini danger" id="confirm-yes">确认</button>
        <button class="mini" id="confirm-no">取消</button>
      </div>
    </div>
  </div>

  <footer>点击标题打开原文，点击星星改星级，点击备注/标签可编辑。</footer>

  <script type="module" src="manager.js"></script>
</body>
</html>
