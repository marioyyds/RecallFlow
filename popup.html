<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title>RecallFlow</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-main">
  <div class="app-topbar">
    <header class="app-header popup-header">
      <div class="brand-group">
        <img class="brand-mark" src="docs/assets/recallflow-mark.svg" alt="" width="28" height="28" aria-hidden="true">
        <div class="brand-text">
          <h1>RecallFlow</h1>
          <span class="page-caption">快速收录</span>
        </div>
      </div>
      <div class="header-actions">
        <span id="total-badge" class="total-badge num">0 条</span>
        <button id="open-assistant" class="icon-btn" type="button" title="打开 AI 助手" aria-label="打开 AI 助手"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-spark"/></svg></button>
        <button id="show-fab" class="icon-btn" type="button" title="在当前网页重新显示悬浮球（右键悬浮球选「隐藏」后用它找回）" aria-label="在当前网页显示悬浮球"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-panel"/></svg></button>
        <button id="open-manager-top" class="icon-btn" type="button" title="打开知识库" aria-label="打开知识库"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-book"/></svg></button>
      </div>
    </header>
  </div>

  <section id="add-panel" class="add-panel is-collapsed">
    <div class="section-kicker">
      <span class="kicker">当前页</span>
      <div class="section-tools">
        <span class="shortcut-hint">Enter 保存</span>
        <button id="toggle-add-panel" class="mini collapse-btn" type="button" aria-expanded="false">展开</button>
      </div>
    </div>
    <div class="add-head">
      <div class="add-head-text">
        <div class="add-title" id="add-title">加载中...</div>
        <div class="add-meta">
          <span id="add-platform" class="platform-badge hidden">-</span>
          <span id="add-exists" class="exists-tag hidden"><span class="exists-dot" aria-hidden="true"></span>已收录</span>
        </div>
      </div>
      <button id="add-btn" class="btn btn-primary add-btn">添加到知识库</button>
    </div>
    <div class="add-fields">
      <div class="type-group" id="type-group"></div>
      <div class="status-group">
        <span class="star-picker" id="star-picker"></span>
        <span class="star-picker-name" id="star-picker-name"></span>
      </div>
      <div class="add-field">
        <label class="input-label" for="tags-input">标签 <span>可选</span></label>
        <input id="tags-input" class="note-input" type="text" placeholder="如：动态规划，面试" aria-label="标签，逗号分隔">
      </div>
      <div class="add-field">
        <label class="input-label" for="note-input">备注 <span>可选</span></label>
        <textarea id="note-input" class="note-input note-area" rows="3" placeholder="写摘要或 Markdown 文档…" aria-label="备注或 Markdown 文档"></textarea>
      </div>
    </div>
  </section>
  <section id="page-unavailable" class="page-unavailable hidden" aria-live="polite">
    <svg class="empty-ico" aria-hidden="true"><use href="icons.svg#i-info"/></svg>
    <strong>当前页面无法收录</strong>
    <span id="unavailable-hint" class="empty-hint">请打开普通网页后再试</span>
  </section>

  <div class="list-head">
    <div class="list-head-top">
      <strong class="list-title">最近收录</strong>
      <span id="visible-count" class="visible-count num"></span>
      <select id="sort-select" class="sort-select" title="排序方式" aria-label="排序方式">
        <option value="updated">最近更新</option>
        <option value="created">最近收录</option>
        <option value="star-desc">重要度 高→低</option>
        <option value="star-asc">重要度 低→高</option>
      </select>
    </div>
    <label class="search-box list-search">
      <svg class="icon icon-sm" aria-hidden="true"><use href="icons.svg#i-search"/></svg>
      <input id="list-search" type="search" placeholder="搜索标题、标签..." aria-label="搜索知识库">
      <kbd id="search-shortcut" class="kbd">Ctrl K</kbd>
    </label>
  </div>

  <nav class="filters" id="filters" aria-label="筛选">
    <button class="filter-chip active" data-filter="all" aria-pressed="true">全部<span class="filter-count">0</span></button>
    <button class="filter-chip" data-filter="wrong" aria-pressed="false">错题<span class="filter-count">0</span></button>
    <button class="filter-chip" data-filter="article" aria-pressed="false">文章<span class="filter-count">0</span></button>
    <button class="filter-chip" data-filter="ai" aria-pressed="false">AI<span class="filter-count">0</span></button>
    <button class="filter-chip" data-filter="note" aria-pressed="false">笔记<span class="filter-count">0</span></button>
  </nav>

  <main id="list" class="list"></main>
  <button id="open-manager-all" class="view-all-btn hidden" type="button">
    <span id="view-all-label">在知识库查看全部</span>
    <span class="view-all-count"><span id="all-items-count" class="num">0</span> 条</span>
    <svg class="icon icon-sm" aria-hidden="true"><use href="icons.svg#i-arrow-right"/></svg>
  </button>
  <div id="empty" class="empty hidden">
    <svg class="empty-ico" aria-hidden="true"><use href="icons.svg#i-book"/></svg>
    <p>还没有内容</p>
    <p class="empty-hint">打开网页后点工具栏图标即可快速收录</p>
  </div>

  </div>

  <footer class="popup-footer">
    <button id="open-manager" type="button" class="foot-link">知识库</button>
    <span class="sep" aria-hidden="true">·</span>
    <button id="open-scripts" type="button" class="foot-link">脚本<span id="scripts-badge" class="nav-badge hidden"></span></button>
    <span class="sep" aria-hidden="true">·</span>
    <button id="open-skills" type="button" class="foot-link">技能</button>
    <span class="sep" aria-hidden="true">·</span>
    <button id="open-settings" type="button" class="foot-link">设置</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
