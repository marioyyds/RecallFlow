<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>访问出错了 · RecallFlow</title>
<style>
  /* 独立错误页：不引 base.css，令牌与共享样式表保持同一套「纸与墨」取值。
     改了 base.css 的令牌，这里要一起改（两处值必须一致，否则页面之间会互相打脸）。 */
  :root {
    --bg: #f6f3ec;
    --paper: #fffdf8;
    --note: #f1ebdf;
    --ink: #211e19;
    --ink-2: #575047;
    --ink-3: #6f6659;
    --line: #e4ddd0;
    --line-strong: #d3c9b7;
    --accent: #a03a22;
    --accent-hover: #8a2f1b;
    --accent-soft: #f7ece7;
    --danger: #a32c2c;
    --warn: #8a5a12;
    --focus-ring: rgba(160, 58, 34, .32);
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
      "Songti SC", "Noto Serif SC", serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
      "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191713;
      --paper: #211e18;
      --note: #2a2620;
      --ink: #ede7db;
      --ink-2: #b9b0a1;
      --ink-3: #988e7e;
      --line: #33302a;
      --line-strong: #46413a;
      --accent: #e08a63;
      --accent-hover: #eda17d;
      --accent-soft: #362622;
      --danger: #e08a63;
      --warn: #d9a94e;
      --focus-ring: rgba(224, 138, 99, .38);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* 一张「记录纸」：纸面靠 1px 发丝线与底色分层，不用大圆角大阴影。
     投影只给真正浮起来的东西 —— 这里唯一浮着的是整张纸，所以只给最淡的一层。 */
  .sheet {
    width: min(460px, 100%);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    box-shadow: 0 1px 2px rgba(33, 30, 25, .05);
    overflow: hidden;
    animation: settle .18s ease-out;
  }

  @keyframes settle {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .sheet-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 22px;
    border-bottom: 1px solid var(--line);
    background: var(--note);
  }

  .kicker {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
    white-space: nowrap;
  }

  .sheet-head .rule { flex: 1 1 auto; height: 1px; background: var(--line-strong); opacity: .6; }

  .sheet-body { padding: 26px 22px 22px; }

  /* 图标：1.6px 描边的 SVG，不用 emoji、不放在彩色圆角方块里 */
  .mark { display: flex; color: var(--accent); margin-bottom: 16px; }
  .mark svg { width: 22px; height: 22px; }

  h1 {
    margin: 0 0 8px;
    font-family: var(--font-display);
    font-size: 23px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: -.01em;
    color: var(--ink);
  }

  p.message {
    margin: 0 0 22px;
    font-size: 13px;
    line-height: 1.8;
    color: var(--ink-2);
    word-break: break-word;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 5px;
    border: 1px solid transparent;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }

  /* 主按钮是唯一一块朱砂：它是这张纸上唯一「现在就做」的动作 */
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fffdf8; }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  .btn-secondary { background: transparent; border-color: var(--line-strong); color: var(--ink-2); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  .check {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 32px;
    font-size: 12px;
    color: var(--ink-3);
    cursor: pointer;
    user-select: none;
  }

  .check input { width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer; margin: 0; }

  .sheet-foot {
    padding: 12px 22px 16px;
    border-top: 1px solid var(--line);
    background: var(--note);
  }

  .hint { margin: 0; font-size: 11.5px; line-height: 1.7; color: var(--ink-3); }

  .btn:focus-visible,
  .check input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }

  @media (max-width: 420px) {
    body { padding: 16px; }
    .sheet-head, .sheet-body, .sheet-foot { padding-left: 18px; padding-right: 18px; }
    .actions { gap: 6px; }
    .btn { flex: 1 1 auto; }
  }
</style>
</head>
<body>
  <main class="sheet" role="alert" aria-labelledby="error-title">
    <header class="sheet-head">
      <span class="kicker" id="error-code">访问出错</span>
      <span class="rule" aria-hidden="true"></span>
    </header>

    <div class="sheet-body">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 8v5"/>
          <circle cx="12" cy="16.6" r=".9" fill="currentColor" stroke="none"/>
          <path d="M12 3.2 21 20H3z"/>
        </svg>
      </span>

      <h1 id="error-title">页面加载失败</h1>
      <p class="message" id="error-message">请稍后重试，或返回上一页。</p>

      <div class="actions">
        <button class="btn btn-primary" type="button" id="btn-retry">重试</button>
        <button class="btn btn-secondary" type="button" id="btn-back">返回上一页</button>
        <button class="btn btn-secondary" type="button" id="btn-home">回到首页</button>
      </div>

      <label class="check">
        <input type="checkbox" id="auto-retry">
        <span>60 秒后自动重试</span>
      </label>
    </div>

    <footer class="sheet-foot">
      <p class="hint">如果问题持续出现，请检查网络连接，或到「设置」里查看 API 配置。</p>
    </footer>
  </main>

<script>
  (function () {
    var params = new URLSearchParams(window.location.search);

    var code = params.get("code") || "";
    var msg = params.get("msg") || "";
    var title = params.get("title") || "";

    var ERRORS = {
      "404": { title: "页面不存在", message: "你访问的页面可能已失效、被移动或删除。" },
      "403": { title: "没有访问权限", message: "当前身份无权访问该资源，请确认权限后再试。" },
      "401": { title: "登录已失效", message: "请先登录或重新授权后再访问。" },
      "500": { title: "服务器开小差了", message: "服务暂时不可用，请稍后重试。" },
      "502": { title: "网关异常", message: "上游服务响应超时，请稍后重试。" },
      "503": { title: "服务暂不可用", message: "服务正在维护或过载，请稍后再试。" },
      "504": { title: "请求超时", message: "服务器响应过慢，请稍后重试。" },
      "offline": { title: "网络连接异常", message: "请检查网络连接后重试。" },
      "timeout": { title: "请求超时", message: "请求超时，请稍后重试。" }
    };

    var known = ERRORS[code] || {};

    document.getElementById("error-code").textContent = code
      ? "错误 " + code
      : "访问出错";

    document.getElementById("error-title").textContent =
      title || known.title || "页面加载失败";

    document.getElementById("error-message").textContent =
      msg || known.message ||
      "抱歉，页面出了点问题，请稍后重试或返回上一页。";

    function retry() {
      window.location.reload();
    }

    function goBack() {
      if (history.length > 1) {
        history.back();
      } else {
        window.location.href = "/";
      }
    }

    function goHome() {
      window.location.href = "/";
    }

    document.getElementById("btn-retry").addEventListener("click", retry);
    document.getElementById("btn-back").addEventListener("click", goBack);
    document.getElementById("btn-home").addEventListener("click", goHome);

    var auto = document.getElementById("auto-retry");
    auto.addEventListener("change", function () {
      if (auto.checked) {
        setTimeout(function () {
          if (auto.checked) window.location.reload();
        }, 60000);
      }
    });

    window.addEventListener("keydown", function (e) {
      if (e.key === "Escape") goBack();
    });
  })();
</script>
</body>
</html>
